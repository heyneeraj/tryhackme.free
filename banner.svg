<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="TryHackMe Free Rooms Tracker" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0f2a1d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22ff88">
        <animate attributeName="stop-color" values="#22ff88;#00d4ff;#22ff88" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#22ff88;#00d4ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="0" y="0" height="260" width="0">
        <animate attributeName="width" values="0;900;900;0" keyTimes="0;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22ff88" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <rect width="900" height="260" rx="16" fill="url(#grid)"/>

  <!-- floating glows -->
  <circle cx="120" cy="60" r="60" fill="#22ff88" opacity="0.10">
    <animate attributeName="cy" values="60;90;60" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="200" r="80" fill="#00d4ff" opacity="0.10">
    <animate attributeName="cy" values="200;170;200" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- falling code columns -->
  <g font-family="monospace" font-size="14" fill="#22ff88" opacity="0.35">
    <text x="60" y="-20">1 0 1<animate attributeName="y" values="-20;280" dur="5s" repeatCount="indefinite"/></text>
    <text x="230" y="-20">0 1 1<animate attributeName="y" values="-20;280" dur="7s" begin="1s" repeatCount="indefinite"/></text>
    <text x="520" y="-20">1 1 0<animate attributeName="y" values="-20;280" dur="6s" begin="2s" repeatCount="indefinite"/></text>
    <text x="700" y="-20">0 0 1<animate attributeName="y" values="-20;280" dur="8s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="840" y="-20">1 0 0<animate attributeName="y" values="-20;280" dur="5.5s" begin="3s" repeatCount="indefinite"/></text>
  </g>

  <!-- shield -->
  <g transform="translate(450 62)">
    <path d="M0 -34 L30 -22 V6 C30 24 14 36 0 42 C-14 36 -30 24 -30 6 V-22 Z" fill="none" stroke="url(#title)" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M-11 4 L-2 13 L13 -8" fill="none" stroke="#22ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50">
      <animate attributeName="stroke-dashoffset" values="50;0;0;50" keyTimes="0;0.3;0.8;1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title (typed) -->
  <g clip-path="url(#typeClip)">
    <text x="450" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="url(#title)">TryHackMe Free Rooms Tracker</text>
    <text x="450" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#9fb4c7">&gt; track rooms · learn hands-on · level up your cyber skills</text>
  </g>

  <!-- blinking cursor -->
  <rect x="450" y="206" width="12" height="4" fill="#22ff88">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline -->
  <rect x="0" y="0" width="900" height="3" fill="#22ff88" opacity="0.25">
    <animate attributeName="y" values="0;260;0" dur="6s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
